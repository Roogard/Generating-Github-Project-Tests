[project]
name = "generating-github-project-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "python-dotenv>=1.0",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
swebench = ["swebench>=2.0", "datasets>=2.0"]

[project.scripts]
ghtest = "src.main:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
