[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghtest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pytest-json-report>=1.5",
    "pytest-cov>=5.0",
]

[project.scripts]
ghtest-api = "api.app:start"
ghtest = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
