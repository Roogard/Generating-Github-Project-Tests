[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggpt"
version = "0.1.0"
requires-python = ">=3.12"
# Base deps are everything the agent itself needs to run inside a
# GitHub Action — LLM clients, pytest plumbing, logging. The webapp
# stack (FastAPI / SQLAlchemy / uvicorn) and the SWT-Bench dataset
# loader are optional extras so action installs stay small and fast.
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "python-dotenv>=1.0",
    "pytest-json-report>=1.5",
    "pytest-timeout>=2.3",
    "structlog>=24.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
]
swtbench = [
    "datasets>=2.19",
]

[project.scripts]
ggpt-api = "api.app:start"

[tool.hatch.build.targets.wheel]
packages = ["api", "src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
