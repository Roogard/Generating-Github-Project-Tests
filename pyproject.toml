[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggpt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pytest-json-report>=1.5",
    "pytest-timeout>=2.3",
    "datasets>=2.19",
    "structlog>=24.0",
]

[project.scripts]
ggpt-api = "api.app:start"

[tool.hatch.build.targets.wheel]
packages = ["api", "src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
