[project]
name = "generating-github-project-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "python-dotenv>=1.0",
    "langchain-openai>=0.3",
    "mutmut>=2.4",
]

[project.scripts]
ghtest = "src.main:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
